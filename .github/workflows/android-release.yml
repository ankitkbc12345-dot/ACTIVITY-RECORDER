name: Android Build & GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute auto-incremented versionCode and versionName
        id: version
        run: |
          NEXT_CODE=$((1 + GITHUB_RUN_NUMBER))
          NEXT_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "version_code=$NEXT_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NEXT_NAME" >> "$GITHUB_OUTPUT"

      - name: Restore or create debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Restored fixed signing key from DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore matching Firebase SHA-1."
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare build secrets
        env:
          ADMIN_ID_SECRET: ${{ secrets.ADMIN_ID }}
          INITIAL_ADMIN_PASSWORD_SECRET: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        run: |
          ADMIN_VAL="${ADMIN_ID_SECRET:-ankitkbc12345@gmail.com}"
          PASS_VAL="${INITIAL_ADMIN_PASSWORD_SECRET:-ankitkbc12345}"
          printf 'ADMIN_ID=%s\nINITIAL_ADMIN_PASSWORD=%s\n' "$ADMIN_VAL" "$PASS_VAL" > .env

      - name: Restore optional google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            echo "Restored app/google-services.json from GitHub secret."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --no-daemon

      - name: Prepare APK for release
        run: |
          APK_SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "ERROR: Built APK not found!"
            exit 1
          fi
          mkdir -p release-apk
          APK_DEST="release-apk/DeviceRecorder-v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.version_code }}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: DeviceRecorder-v${{ steps.version.outputs.version_name }}
          path: ${{ env.apk_path }}

      - name: Generate version manifest
        run: |
          cat << 'EOF' > version.json
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "apkUrl": "https://github.com/ankitkbc12345-dot/ACTIVITY-RECORDER/releases/download/v${{ steps.version.outputs.version_name }}/DeviceRecorder-v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.version_code }}.apk",
            "releaseNotes": "Automated Android APK Release"
          }
          EOF
          echo "version_json_path=version.json" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload APK and manifest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Calendar v${{ steps.version.outputs.version_name }}
          body: |
            Automated Android APK Release
            versionName: ${{ steps.version.outputs.version_name }}
            versionCode: ${{ steps.version.outputs.version_code }}
          files: |
            ${{ env.apk_path }}
            ${{ env.version_json_path }}
          draft: false
          prerelease: false
