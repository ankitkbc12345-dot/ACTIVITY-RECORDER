name: Android Build & GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compute auto-incremented versionCode and versionName
        id: version
        run: |
          BASE_CODE=1
          NEXT_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          NEXT_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "version_code=$NEXT_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NEXT_NAME" >> "$GITHUB_OUTPUT"
          echo "Using versionCode=$NEXT_CODE, versionName=$NEXT_NAME"

      - name: Prepare signing keystore and build secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ADMIN_ID_SECRET: ${{ secrets.ADMIN_ID }}
          INITIAL_ADMIN_PASSWORD_SECRET: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
          fi

          if [ ! -f .env ]; then
            ADMIN_VAL="${ADMIN_ID_SECRET:-ankitkbc12345@gmail.com}"
            PASS_VAL="${INITIAL_ADMIN_PASSWORD_SECRET:-ankitkbc12345}"
            printf "ADMIN_ID=%s\nINITIAL_ADMIN_PASSWORD=%s\n" "$ADMIN_VAL" "$PASS_VAL" > .env
          fi

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --no-daemon

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_VARIANT" = "release" ]; then
            gradle :app:assembleRelease \
              -PversionCode=${{ steps.version.outputs.version_code }} \
              -PversionName=${{ steps.version.outputs.version_name }} \
              -PgithubRepo=${{ github.repository }} \
              --no-daemon
            APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            gradle :app:assembleDebug \
              -PversionCode=${{ steps.version.outputs.version_code }} \
              -PversionName=${{ steps.version.outputs.version_name }} \
              -PgithubRepo=${{ github.repository }} \
              --no-daemon
            APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "ERROR: Built APK not found!"
            exit 1
          fi

          mkdir -p release-apk
          APK_DEST="release-apk/DeviceRecorder-v${{ steps.version.outputs.version_name }}-b${{ steps.version.outputs.version_code }}.apk"
          cp "$APK_SRC" "$APK_DEST"
          echo "apk_path=$APK_DEST" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceRecorder-v${{ steps.version.outputs.version_name }}
          path: ${{ env.apk_path }}

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Device Recorder v${{ steps.version.outputs.version_name }}
          body: |
            Automated Android APK Release
            versionName: ${{ steps.version.outputs.version_name }}
            versionCode: ${{ steps.version.outputs.version_code }}
          files: ${{ env.apk_path }}
          draft: false
          prerelease: false
